<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420">
<defs>
<style>
  @keyframes dash{0%{stroke-dashoffset:220;opacity:0}10%{opacity:.9}80%{opacity:.6}100%{stroke-dashoffset:-220;opacity:0}}
  @keyframes pop{0%,100%{r:19}50%{r:23}}
  @keyframes popL{0%,100%{r:21}50%{r:25}}
  @keyframes ring{0%,100%{r:22;opacity:.3}50%{r:30;opacity:.08}}
  @keyframes fade{0%,100%{opacity:.7}50%{opacity:1}}

  .bg{fill:#0d0d14}
  .card{fill:#0d0d14;stroke:#1e1c30;stroke-width:1}

  .np{fill:#7F77DD;opacity:.88}
  .nt{fill:#1D9E75;opacity:.88}
  .no{fill:#534AB7;opacity:.95}
  .no2{fill:#0F6E56;opacity:.95}

  .lbl{font:600 10.5px system-ui,sans-serif;fill:#EEEDFE;text-anchor:middle;dominant-baseline:middle}
  .lbl2{font:600 10.5px system-ui,sans-serif;fill:#E1F5EE;text-anchor:middle;dominant-baseline:middle}
  .llayer{font:500 9px system-ui,sans-serif;fill:#3a3860;text-anchor:middle;letter-spacing:.08em}
  .hint{font:400 10px system-ui,sans-serif;fill:#2e2c48;text-anchor:middle}
  .leg{font:500 10px system-ui,sans-serif;fill:#4a4870;dominant-baseline:middle}

  .wire{fill:none;stroke:#7F77DD;stroke-width:.5;opacity:.14}
  .conn{fill:none;stroke:#EF9F27;stroke-width:2;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;opacity:0}

  /* --- INPUT → HIDDEN1 pulses --- */
  .c1{animation:dash 1.6s ease-in-out 0s infinite}
  .c2{animation:dash 1.6s ease-in-out .15s infinite}
  .c3{animation:dash 1.6s ease-in-out .3s infinite}
  .c4{animation:dash 1.6s ease-in-out .45s infinite}
  .c5{animation:dash 1.6s ease-in-out .6s infinite}
  .c6{animation:dash 1.6s ease-in-out .75s infinite}
  .c7{animation:dash 1.6s ease-in-out .9s infinite}
  .c8{animation:dash 1.6s ease-in-out 1.05s infinite}
  .c9{animation:dash 1.6s ease-in-out 1.2s infinite}

  /* --- HIDDEN1 → HIDDEN2 pulses --- */
  .d1{animation:dash 1.6s ease-in-out .5s infinite}
  .d2{animation:dash 1.6s ease-in-out .65s infinite}
  .d3{animation:dash 1.6s ease-in-out .8s infinite}
  .d4{animation:dash 1.6s ease-in-out .95s infinite}
  .d5{animation:dash 1.6s ease-in-out 1.1s infinite}
  .d6{animation:dash 1.6s ease-in-out 1.25s infinite}

  /* --- HIDDEN2 → OUTPUT pulses --- */
  .e1{animation:dash 1.6s ease-in-out 1.1s infinite}
  .e2{animation:dash 1.6s ease-in-out 1.25s infinite}
  .e3{animation:dash 1.6s ease-in-out 1.4s infinite}

  /* --- Node pulses --- */
  .n-py{animation:popL 2s ease-in-out .3s infinite}
  .n-pt{animation:pop 2.2s ease-in-out .8s infinite}
  .n-llm{animation:popL 2s ease-in-out 1.1s infinite}

  /* --- Output rings --- */
  .r1{animation:ring 2.8s ease-in-out 1.5s infinite}
  .r2{animation:ring 2.8s ease-in-out 2.1s infinite}
  .r3{animation:ring 2.8s ease-in-out 2.7s infinite}
</style>
</defs>



<!-- Card background -->
<rect class="card" x="0" y="0" width="740" height="420" rx="16"/>

<g transform="translate(-40,0)">
<!-- Layer labels -->
<text class="llayer" x="90" y="28">INPUT</text>
<text class="llayer" x="280" y="28">HIDDEN L1</text>
<text class="llayer" x="470" y="28">HIDDEN L2</text>
<text class="llayer" x="620" y="28">HIDDEN L3</text>
<text class="llayer" x="710" y="28">OUTPUT</text>

<!-- ═══════════════════════════════════════════
     STATIC BACKGROUND WIRES
════════════════════════════════════════════ -->

<!-- Input → H1 -->
<path class="wire" d="M109,78 Q195,88 261,100"/>
<path class="wire" d="M109,78 Q195,160 261,170"/>
<path class="wire" d="M109,140 Q195,100 261,100"/>
<path class="wire" d="M109,140 Q195,155 261,170"/>
<path class="wire" d="M109,140 Q195,200 261,240"/>
<path class="wire" d="M109,205 Q195,140 261,100"/>
<path class="wire" d="M109,205 Q195,170 261,170"/>
<path class="wire" d="M109,205 Q195,220 261,240"/>
<path class="wire" d="M109,205 Q195,285 261,305"/>
<path class="wire" d="M109,205 Q195,340 261,360"/>
<path class="wire" d="M109,268 Q195,340 261,360"/>
<path class="wire" d="M109,328 Q195,305 261,305"/>

<!-- H1 → H2 -->
<path class="wire" d="M299,100 Q385,120 451,135"/>
<path class="wire" d="M299,100 Q385,200 451,215"/>
<path class="wire" d="M299,170 Q385,140 451,135"/>
<path class="wire" d="M299,170 Q385,200 451,215"/>
<path class="wire" d="M299,240 Q385,215 451,215"/>
<path class="wire" d="M299,240 Q385,295 451,300"/>
<path class="wire" d="M299,305 Q385,140 451,135"/>
<path class="wire" d="M299,360 Q385,295 451,300"/>

<!-- H2 → Output -->
<path class="wire" d="M489,135 Q555,148 598,160"/>
<path class="wire" d="M489,135 Q555,225 598,240"/>
<path class="wire" d="M489,215 Q555,170 598,160"/>
<path class="wire" d="M489,215 Q555,240 598,240"/>
<path class="wire" d="M489,300 Q555,315 598,328"/>

<!-- ═══════════════════════════════════════════
     ANIMATED PULSES  (input → h1)
════════════════════════════════════════════ -->
<path class="conn c1" d="M109,78 Q195,88 261,100"/>
<path class="conn c2" d="M109,205 Q195,140 261,100"/>
<path class="conn c3" d="M109,140 Q195,155 261,170"/>
<path class="conn c4" d="M109,205 Q195,170 261,170"/>
<path class="conn c5" d="M109,205 Q195,220 261,240"/>
<path class="conn c6" d="M109,140 Q195,200 261,240"/>
<path class="conn c7" d="M109,205 Q195,285 261,305"/>
<path class="conn c8" d="M109,268 Q195,340 261,360"/>
<path class="conn c9" d="M109,328 Q195,305 261,305"/>

<!-- Animated pulses (h1 → h2) -->
<path class="conn d1" d="M299,100 Q385,120 451,135"/>
<path class="conn d2" d="M299,170 Q385,140 451,135"/>
<path class="conn d3" d="M299,100 Q385,200 451,215"/>
<path class="conn d4" d="M299,170 Q385,200 451,215"/>
<path class="conn d5" d="M299,240 Q385,295 451,300"/>
<path class="conn d6" d="M299,305 Q385,140 451,135"/>

<!-- Animated pulses (h2 → output) -->
<path class="conn e1" d="M489,135 Q555,148 598,160"/>
<path class="conn e2" d="M489,215 Q555,240 598,240"/>
<path class="conn e3" d="M489,300 Q555,315 598,328"/>

